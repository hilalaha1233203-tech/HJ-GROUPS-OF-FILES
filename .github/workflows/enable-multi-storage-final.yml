name: Enable multi-channel Telegram storage

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply multi-channel storage patch
        run: |
          echo "Manual-only legacy patch workflow. Review and run only when intentionally applying this historical storage patch."
      - name: Validate Python syntax
        run: python -m py_compile bot.py handlers/*.py configs.py

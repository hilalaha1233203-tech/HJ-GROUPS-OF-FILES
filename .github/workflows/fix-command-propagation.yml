async def _run_batch_from_items(bot, m, items):
    if len(items) < 2:
        await m.reply_text("Forward the FIRST message and the LAST message from the same channel, then send /batch.")
        return False
    source_chat_id = int(items[-1]["source_chat_id"])
    if any(int(x["source_chat_id"]) != source_chat_id for x in items[-2:]):
        await m.reply_text("The first and last messages must come from the same channel.")
        return False
    start_id = int(items[-2]["source_message_id"])
    end_id = int(items[-1]["source_message_id"])
    lo, hi = sorted((start_id, end_id))
    status = await m.reply_text(f"⏳ Preparing batch: `{lo}` → `{hi}`")
    await save_batch_media_in_channel(
        bot,
        status,
        list(range(lo, hi + 1)),
        source_chat_id=source_chat_id,
        request_user_id=m.from_user.id,
    )
    _reset_workflow(m.from_user.id)
    return True


@Bot.on_message(filters.private & filters.command("batch"))
async def batch(bot, m):
    state = _workflow_state(m.from_user.id)
    # Backward-compatible explicit syntax: reply + /batch start_id end_id
    if len(m.command) >= 3:
        try:
            start_id = int(m.command[1])
            end_id = int(m.command[2])
        except ValueError:
            await m.reply_text("Message IDs must be numbers.")
            return
        origin = _get_forward_origin(m.reply_to_message) if m.reply_to_message else None
        source_chat_id = origin[0] if origin else (state["recent"][-1]["source_chat_id"] if state["recent"] else None)
        if source_chat_id is None:
            await m.reply_text("Forward one message from the source channel first.")
            return
        status = await m.reply_text(f"⏳ Preparing batch: `{min(start_id, end_id)}` → `{max(start_id, end_id)}`")
        await save_batch_media_in_channel(
            bot,
            status,
            list(range(min(start_id, end_id), max(start_id, end_id) + 1)),
            source_chat_id=int(source_chat_id),
            request_user_id=m.from_user.id,
        )
        _reset_workflow(m.from_user.id)
        return

    recent = _same_source_recent(state)
    if len(recent) >= 2:
        await _run_batch_from_items(bot, m, recent[-2:])
        return

    state["batch_mode"] = True
    if recent and state.get("batch_start") is None:
        state["batch_start"] = recent[-1]
        await m.reply_text("✅ FIRST message selected. Now forward the LAST message from the same channel.")
    else:
        await m.reply_text("📦 Batch mode started. Forward the FIRST message, then the LAST message from the same channel.")


@Bot.on_message(filters.private & filters.command("custom_batch"))
async def custom_batch(bot, m):
    state = _workflow_state(m.from_user.id)
    if len(m.command) >= 2:
        try:
            ids = [int(x) for x in m.command[1:]]
        except ValueError:
            await m.reply_text("Message IDs must be numbers.")
            return
        origin = _get_forward_origin(m.reply_to_message) if m.reply_to_message else None
        source_chat_id = origin[0] if origin else (state["recent"][-1]["source_chat_id"] if state["recent"] else None)
        if source_chat_id is None:
            await m.reply_text("Forward one message from the source channel first.")
            return
    else:
        recent = _same_source_recent(state)
        if not recent:
            await m.reply_text("Forward the messages you want to include, then send /custom_batch.")
            return
        source_chat_id = int(recent[-1]["source_chat_id"])
        ids = []
        for item in recent:
            if int(item["source_chat_id"]) == source_chat_id and int(item["source_message_id"]) not in ids:
                ids.append(int(item["source_message_id"]))

    status = await m.reply_text(f"⏳ Saving {len(ids)} selected message(s)...")
    await save_batch_media_in_channel(
        bot,
        status,
        ids,
        source_chat_id=int(source_chat_id),
        request_user_id=m.from_user.id,
    )
    _reset_workflow(m.from_user.id)



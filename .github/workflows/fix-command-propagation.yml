def _workflow_state(user_id):
    key = str(int(user_id))
    return USER_WORKFLOW.setdefault(key, {"recent": [], "batch_mode": False, "batch_start": None, "batch_end": None})


def _get_forward_origin(message):
    if message is None:
        return None
    origin = getattr(message, "forward_origin", None)
    chat = getattr(origin, "chat", None) if origin else None
    message_id = getattr(origin, "message_id", None) if origin else None
    if chat is not None and message_id:
        return int(chat.id), int(message_id)

    forwarded_chat = getattr(message, "forward_from_chat", None)
    forwarded_message_id = getattr(message, "forward_from_message_id", None)
    if forwarded_chat is not None and forwarded_message_id:
        return int(forwarded_chat.id), int(forwarded_message_id)
    return None


def _record_forwarded_message(message):
    origin = _get_forward_origin(message)
    if origin is None:
        return None
    state = _workflow_state(message.from_user.id)
    item = {
        "source_chat_id": origin[0],
        "source_message_id": origin[1],
        "bot_message_id": int(message.id),
    }
    recent = [x for x in state["recent"] if not (x["source_chat_id"] == item["source_chat_id"] and x["source_message_id"] == item["source_message_id"])]
    recent.append(item)
    state["recent"] = recent[-100:]
    if state.get("batch_mode"):
        if state.get("batch_start") is None:
            state["batch_start"] = item
        elif state.get("batch_end") is None and int(state["batch_start"]["source_chat_id"]) == int(item["source_chat_id"]):
            state["batch_end"] = item
    return item


def _same_source_recent(state):
    if not state.get("recent"):
        return []
    source_chat_id = state["recent"][-1]["source_chat_id"]
    rows = [x for x in state["recent"] if int(x["source_chat_id"]) == int(source_chat_id)]
    return rows


def _reset_workflow(user_id):
    USER_WORKFLOW[str(int(user_id))] = {"recent": [], "batch_mode": False, "batch_start": None, "batch_end": None}

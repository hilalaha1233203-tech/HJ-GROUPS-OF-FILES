name: Fix command propagation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply command propagation fix
        run: python .github/scripts/fix_command_propagation.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "No changes needed"; exit 0; fi
          git add bot.py
          git commit -m "Fix command handlers being blocked by generic private handler"
          git push

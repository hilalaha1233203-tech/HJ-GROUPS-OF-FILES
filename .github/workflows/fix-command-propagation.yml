          import re

          def replace_once(path, pattern, replacement, flags=re.S):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = len(re.findall(pattern, s, flags))
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, found {n}: {pattern}')
              s = re.sub(pattern, replacement, s, count=1, flags=flags)
              p.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------
          # configs.py: configurable channel-join buttons + HJ tag
          # ------------------------------------------------------------

        f'ᴘʟᴇᴀꜱᴇ ʟɪꜱᴛᴇɴ ᴛʜɪꜱ ᴍᴇꜱꜱᴀɢᴇ ʙᴇꜰᴏʀᴇ "{human}" ᴛᴏ ᴀᴠᴏɪᴅ ʟᴏꜱɪɴɢ...\n\n'

name: Repair and complete FileStore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good bot and apply fixes
        shell: bash
        run: |
          set -e
          git checkout 73865cdbd7b06cc9e09c36f6e98537d0e3abb4af -- bot.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bot.py')
          s=p.read_text()
          s=s.replace('def make_share_link(message_id: int) -> str:\n    token = str_to_b64(str(int(message_id)))\n    return f"https://telegram.me/{Config.BOT_USERNAME}?start=PredatorHackerzZ_{to[...]
          s=s.replace('share_link = make_share_link(int(db_message.id))', 'share_link = make_share_link(int(db_message.id), channel_id)')
          old='''        try:\n            file_id = int(b64_to_str(usr_cmd).split("_")[-1])\n        except (Error, UnicodeDecodeError):\n            file_id = int(usr_cmd.split("_")[-1])\n\n    [...]
          new='''        try:\n            decoded = b64_to_str(usr_cmd)\n            if "|" in decoded:\n                channel_part, message_part = decoded.split("|", 1)\n                channe[...]
          if old not in s: raise SystemExit('start block not found')
          s=s.replace(old,new)
          s=s.replace('await send_media_and_reply(bot, user_id=cmd.from_user.id, file_id=int(message_id))','await send_media_and_reply(bot, user_id=cmd.from_user.id, file_id=int(message_id), chann[...]
          marker='@Bot.on_message(filters.private & filters.command("broadcast") & filters.user(Config.BOT_OWNER) & filters.reply)'
          handlers='''async def _reply_saved_link(bot, m):\n    if not m.reply_to_message:\n        await m.reply_text("Reply to a file/media/message and use this command.")\n        return\n    s[...]
          if marker not in s: raise SystemExit('handler marker not found')
          s=s.replace(marker, handlers+marker, 1)
          marker2='async def setup_bot_commands():'
          recovery='''async def recover_storage_channels():\n    try:\n        stored = await db.get_storage_channels()\n    except Exception as err:\n        print(f"Storage settings read failed:[...]
          if marker2 not in s: raise SystemExit('setup marker not found')
          s=s.replace(marker2,recovery+marker2,1)
          s=s.replace('    await setup_bot_commands()', '    await recover_storage_channels()\n    await setup_bot_commands()', 1)
          p.write_text(s)
          PY
          python3 -m py_compile bot.py
      - name: Update delivery and saved links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('handlers/send_file.py'); s=p.read_text()
          s=s.replace('async def media_forward(bot: Client, user_id: int, file_id: int):','async def media_forward(bot: Client, user_id: int, file_id: int, channel_id=None):')
          s=s.replace('channel_id = await db.get_db_channel_id()','channel_id = channel_id or await db.get_db_channel_id()',1)
          s=s.replace('async def send_media_and_reply(bot: Client, user_id: int, file_id: int):\n    sent_message = await media_forward(bot, user_id, file_id)','async def send_media_and_reply(bot:[...]
          p.write_text(s)
          p=Path('handlers/save_media.py'); s=p.read_text()
          old1='share_link = f"https://telegram.me/{Config.BOT_USERNAME}?start=PredatorHackerzZ_{str_to_b64(str(SaveMessage.id))}"'
          new1='payload = f"{channel_id}|{SaveMessage.id}"\n        share_link = f"https://telegram.me/{Config.BOT_USERNAME}?start=PredatorHackerzZ_{str_to_b64(payload)}"'
          old2='share_link = f"https://telegram.me/{Config.BOT_USERNAME}?start=PredatorHackerzZ_{str_to_b64(file_er_id)}"'
          new2='payload = f"{channel_id}|{file_er_id}"\n        share_link = f"https://telegram.me/{Config.BOT_USERNAME}?start=PredatorHackerzZ_{str_to_b64(payload)}"'
          s=s.replace(old1,new1).replace(old2,new2)
          p.write_text(s)
          PY
          python3 -m py_compile bot.py handlers/send_file.py handlers/save_media.py handlers/database.py configs.py
      - name: Commit repaired source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bot.py handlers/send_file.py handlers/save_media.py
          git diff --cached --quiet && exit 0
          git commit -m "Repair storage persistence, legacy links and commands"
          git push origin HEAD:main

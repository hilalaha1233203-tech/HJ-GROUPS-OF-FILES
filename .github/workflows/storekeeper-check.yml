name: Store Keeper feature checks

on:
  push:
    branches:
      - main
      - feat/storekeeper-compression-streaming
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile all Python sources
        run: python -m compileall -q bot.py bot_legacy.py enhancements.py handlers scripts

      - name: Compression unit tests
        run: python -m unittest scripts/test_compression_runner.py -v

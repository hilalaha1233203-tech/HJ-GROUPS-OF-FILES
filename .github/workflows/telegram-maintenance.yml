name: HJ Telegram Maintenance

on:
  workflow_dispatch:
    inputs:
      max_compression_jobs:
        description: "Legacy compression queue is intentionally disabled; use the single-item safe workflows."
        required: false
        default: "0"

concurrency:
  group: hj-telegram-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DB_CHANNEL: ${{ secrets.DB_CHANNEL }}
    steps:
      - name: Check maintenance configuration
        id: config
        shell: bash
        run: |
          missing=()
          [[ -n "$API_ID" ]] || missing+=(API_ID)
          [[ -n "$API_HASH" ]] || missing+=(API_HASH)
          [[ -n "$BOT_TOKEN" ]] || missing+=(BOT_TOKEN)
          [[ -n "$SUPABASE_URL" ]] || missing+=(SUPABASE_URL)
          [[ -n "$SUPABASE_SERVICE_ROLE_KEY" ]] || missing+=(SUPABASE_SERVICE_ROLE_KEY)
          if ((${#missing[@]})); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' "::notice::Compression maintenance is not configured; no media job will run."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Install media tools
        if: steps.config.outputs.configured == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg ghostscript
          ffmpeg -version | head -n 1
          gs --version

      - name: Setup Python
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-maintenance.txt

      - name: Install maintenance dependencies
        if: steps.config.outputs.configured == 'true'
        run: python -m pip install -r requirements-maintenance.txt

      - name: Configuration status
        if: steps.config.outputs.configured != 'true'
        run: echo "✅ No secrets configured yet; maintenance is intentionally idle."

name: HJ Telegram Maintenance

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      max_compression_jobs:
        description: "Maximum compression jobs to process in this run"
        required: false
        default: "10"

concurrency:
  group: hj-telegram-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg ghostscript
          ffmpeg -version | head -n 1
          gs --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-maintenance.txt

      - name: Install maintenance dependencies
        run: python -m pip install -r requirements-maintenance.txt

      - name: Process compression queue
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_COMPRESSION_JOBS: ${{ github.event.inputs.max_compression_jobs || '10' }}
        run: python scripts/compression_runner.py

      - name: Refresh Telegram media index
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DB_CHANNEL: ${{ secrets.DB_CHANNEL }}
          MEDIA_INDEX_MAX_MESSAGES: "5000"
        run: python scripts/media_indexer.py

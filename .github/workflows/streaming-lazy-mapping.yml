name: HJ Streaming Lazy Mapping

on:
  workflow_dispatch:
    inputs:
      content_kind:
        description: "HJ Web content kind"
        required: true
        type: choice
        options:
          - audio
          - video
          - book
      source_message_id:
        description: "One Telegram message ID only"
        required: true
        type: string

permissions:
  contents: read

jobs:
  map-one:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      FILES_SUPABASE_URL: ${{ secrets.FILES_SUPABASE_URL }}
      FILES_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FILES_SUPABASE_SERVICE_ROLE_KEY }}
      WEB_SUPABASE_URL: ${{ secrets.WEB_SUPABASE_URL }}
      WEB_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.WEB_SUPABASE_SERVICE_ROLE_KEY }}
      CONTENT_KIND: ${{ inputs.content_kind }}
      SOURCE_MESSAGE_ID: ${{ inputs.source_message_id }}
    steps:
      - name: Validate one-item configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_MESSAGE_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::source_message_id must be a positive integer."
            exit 1
          }
          missing=()
          for name in BOT_TOKEN FILES_SUPABASE_URL FILES_SUPABASE_SERVICE_ROLE_KEY WEB_SUPABASE_URL WEB_SUPABASE_SERVICE_ROLE_KEY; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]})); then
            echo "::error::Required configuration values are missing: ${missing[*]}"
            exit 1
          fi
          echo "Configuration present; secret values are not printed."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mapping dependencies
        run: python -m pip install -r requirements-maintenance.txt requests

      - name: Verify and map exactly one Telegram source
        run: python scripts/streaming_lazy_mapper.py